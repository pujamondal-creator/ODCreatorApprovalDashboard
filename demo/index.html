__def('sheets',function(module,exports){
// The two sources the app reads from. In demo mode both live inside data/db.json (db.sheets).
//
//  1. Central leads sheet: every OD's followers we may reach out to, with a Fit / Not fit qualification
//     and follower count. Rows marked Fit appear on that OD's dashboard, highest followers first.
//     Row shape: { od: '@od.handle', handle: '@creator', name: 'Creator Name', followers: 12400, fit: 'Fit' }
//
//  2. BD Creators Tracker: column C = creator IG handle, columns U / AB / AI / AP = the OD handle used for
//     outreach 1 to 4, column AV = status ("AM Allocation" or "Handed-over" means signed).
//     Row shape: { C: '@creator', U: '@od.handle', AB: '', AI: '', AP: '', AV: 'Replied' }

const cfg = require('./config');

function readLeadsSheet(db) {
  if (cfg.SHEETS_MODE === 'mock') return db.sheets.leads;
  throw new Error('Google Sheets reader not connected yet. Add a service account and implement readLeadsSheet.');
}

function readTracker(db) {
  if (cfg.SHEETS_MODE === 'mock') return db.sheets.tracker;
  throw new Error('Google Sheets reader not connected yet. Add a service account and implement readTracker.');
}

module.exports = { readLeadsSheet, readTracker };

__def('sync',function(module,exports){
const cfg = require('./config');
const sheets = require('./sheets');

// Normalise IG handles so "@Maya", "maya ", and "https://instagram.com/maya/" all match.
function norm(h) {
  return String(h || '')
    .trim()
    .toLowerCase()
    .replace(/^https?:\/\/(www\.)?instagram\.com\//, '')
    .replace(/[/?#].*$/, '')
    .replace(/^@/, '')
    .replace(/\s+/g, '');
}

// Tracker status (column AV) -> yes (signed) / progress / no
function trackerStatus(av) {
  const s = String(av || '').trim().toLowerCase();
  if (cfg.TRACKER.signedStatuses.includes(s)) return 'yes';
  if (cfg.TRACKER.inProgressStatuses.includes(s)) return 'progress';
  return 'no';
}

function titleFromHandle(key) {
  return key.split(/[._]/).filter(Boolean).map((w) => w[0].toUpperCase() + w.slice(1)).join(' ');
}

// Imports the Fit leads from the central leads sheet for the given ODs (all ODs when none given).
// Decisions made by ODs are never overwritten.
function importLeads(db, odIds) {
  const scope = odIds ? new Set(odIds) : null;
  const odByHandle = {};
  db.ods.forEach((o) => (odByHandle[norm(o.handle)] = o));
  const index = new Map(db.leads.map((l) => [l.id, l]));
  let added = 0;
  const touched = new Set();
  for (const row of sheets.readLeadsSheet(db)) {
    const od = odByHandle[norm(row.od)];
    if (!od || (scope && !scope.has(od.id))) continue;
    const key = norm(row.handle);
    if (!key) continue;
    touched.add(od.id);
    const fit = String(row.fit).trim().toLowerCase() === 'fit';
    const id = od.id + '|' + key;
    const existing = index.get(id);
    if (existing) {
      existing.fit = fit;
      existing.followers = Number(row.followers) || 0;
      existing.name = row.name || existing.name;
    } else if (fit) {
      const lead = { id, odId: od.id, key, handle: '@' + key, name: row.name || titleFromHandle(key), followers: Number(row.followers) || 0, fit: true, rank: 0, decision: null };
      db.leads.push(lead);
      index.set(id, lead);
      added++;
    }
  }
  for (const od of db.ods) {
    if (scope && !scope.has(od.id)) continue;
    od.leadsSyncedAt = new Date().toISOString();
    db.leads.filter((l) => l.odId === od.id && l.fit).sort((a, b) => b.followers - a.followers).forEach((l, i) => (l.rank = i + 1));
  }
  return added;
}

// Reads the BD Creators Tracker: who outreached whom (columns U, AB, AI, AP) and the status (column AV).
function syncTracker(db, silent) {
  const T = cfg.TRACKER;
  const odByHandle = {};
  db.ods.forEach((o) => (odByHandle[norm(o.handle)] = o));
  const nameByKey = {};
  db.leads.forEach((l) => { if (!nameByKey[l.key]) nameByKey[l.key] = l.name; });
  const pairs = [];
  const seen = new Set();
  let newSigned = 0;
  for (const row of sheets.readTracker(db)) {
    const creator = norm(row[T.creatorHandleColumn]);
    if (!creator) continue;
    const status = trackerStatus(row[T.statusColumn]);
    const date = row.date || new Date().toISOString();
    for (const col of T.outreachColumns) {
      const od = odByHandle[norm(row[col])];
      if (!od || seen.has(creator + '|' + od.id)) continue;
      seen.add(creator + '|' + od.id);
      pairs.push({ key: creator, handle: '@' + creator, name: nameByKey[creator] || titleFromHandle(creator), odId: od.id, odName: od.name, odHandle: od.handle, status, date });
      if (status === 'yes') {
        od.signed = od.signed || [];
        if (!od.signed.some((s) => s.key === creator)) {
          od.signed.push({ key: creator, handle: '@' + creator, at: date, seen: silent });
          newSigned++;
          if (!silent) db.log.unshift({ at: new Date().toISOString(), text: 'Signed through ' + od.name + ': @' + creator });
        }
      }
    }
  }
  pairs.sort((a, b) => new Date(b.date) - new Date(a.date));
  db.trackerView = pairs;
  db.lastTrackerSyncAt = new Date().toISOString();
  return newSigned;
}

// odIds: import leads for these ODs (omit for all). tracker: also refresh the tracker view.
function run(db, { silent = false, odIds, tracker = true } = {}) {
  const result = { leadsAdded: 0, newSigned: 0 };
  if (odIds !== null) result.leadsAdded = importLeads(db, odIds);
  if (tracker) result.newSigned = syncTracker(db, silent);
  return result;
}

module.exports = { run, norm, trackerStatus };

});
__def('stats',function(module,exports){
// A lead is cleared for outreach when the OD has confirmed their list and marked that creator Yes.
function isCleared(od, lead) {
  return !!od.confirmedAt && lead.fit && lead.decision === 'yes';
}

function odStats(db, od) {
  const mine = db.leads.filter((l) => l.odId === od.id && l.fit);
  const count = (d) => mine.filter((l) => l.decision === d).length;
  const yes = count('yes'), no = count('no'), friend = count('friend');
  const total = mine.length;
  const pending = total - yes - no - friend;
  return {
    id: od.id, name: od.name, handle: od.handle, owner: od.owner, token: od.token,
    synced: !!od.leadsSyncedAt, total, yes, no, friend, pending,
    pctReviewed: total ? Math.round(((total - pending) / total) * 100) : 0,
    confirmed: !!od.confirmedAt, confirmedAt: od.confirmedAt || null,
    cleared: od.confirmedAt ? yes : 0,
    signed: (od.signed || []).length,
  };
}

module.exports = { isCleared, odStats };

// Dummy data for the demo. Everything here is made up.

function rng(seed) {
  let a = seed;
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

const SUFFIX = ['travels', 'fits', 'bakes', 'films', 'cooks', 'studies', 'styles', 'writes', 'builds', 'runs', 'codes', 'paints', 'daily', 'eats', 'notes'];
const LAST = ['R.', 'T.', 'K.', 'S.', 'H.', 'P.', 'M.', 'A.', 'B.', 'D.', 'W.', 'L.'];

const ODS = [
  { name: 'Sara Lindqvist', handle: '@sara.creates', token: 'sara-7f3a91' },
  { name: 'Daniel Wu', handle: '@daniel.wanders', token: 'daniel-2b8c40' },
  { name: 'Priya Nair', handle: '@priyanotes', token: 'priya-9d51e7' },
  { name: 'Kofi Asante', handle: '@kofiafterhours', token: 'kofi-41ac6d' },
  { name: 'Leila Boutros', handle: '@leilabakes', token: 'leila-c3e208' },
  { name: 'Marcus Tan', handle: '@marcus.trains', token: 'marcus-58f1b2' },
];

function build() {
  const rand = rng(20261118);
  const now = Date.now();
  const ods = ODS.map((o, i) => ({ id: 'od' + (i + 1), name: o.name, handle: o.handle, token: o.token, owner: 'AES', confirmedAt: null, leadsSyncedAt: null, signed: [] }));

  // Central leads sheet: every OD's followers with a Fit / Not fit qualification.
  const leadsSheet = [];
  for (const od of ods) {
    const used = new Set();
    for (let i = 0; i < 140; i++) {
      let h;
      do {
        const f = FIRST[Math.floor(rand() * FIRST.length)];
        const s = SUFFIX[Math.floor(rand() * SUFFIX.length)];
        h = f + (rand() < 0.5 ? '.' : '_') + s + (used.size > 60 ? Math.floor(rand() * 90 + 10) : '');
      } while (used.has(h));
      used.add(h);
      const first = h[0].toUpperCase() + h.slice(1).split(/[._]/)[0];
      leadsSheet.push({
        od: od.handle, handle: '@' + h, name: first + ' ' + LAST[Math.floor(rand() * LAST.length)],
        followers: Math.round(2000 * Math.pow(200, rand())), fit: rand() < 0.85 ? 'Fit' : 'Not fit',

  const tracker = [];

  const odVariant = (o) => (rand() < 0.3 ? o.handle.slice(1) : o.handle);
  for (const od of ods) {
    const mine = leadsSheet.filter((r) => r.od === od.handle && r.fit === 'Fit');
    for (let k = 0; k < 26; k++) {
      const lead = mine[Math.floor(rand() * mine.length)];
      const key = lead.handle.slice(1);
      if (seen.has(key)) continue;
      seen.add(key);
      let av, ageDays;
      const r = rand();
      if (k < 2) { av = k % 2 ? 'Handed-over' : 'AM Allocation'; ageDays = rand() * 5; }
      else if (r < 0.22) { av = rand() < 0.5 ? 'AM Allocation' : 'Handed-over'; ageDays = rand() * 365; }
      else if (r < 0.42) { av = rand() < 0.5 ? 'Replied' : 'Call booked'; ageDays = rand() * 40; }
      else if (r < 0.55) { av = 'Not interested'; ageDays = rand() * 60; }
      else { av = ''; ageDays = rand() * 40; }
      const row = { C: variants[Math.floor(rand() * variants.length)](key), U: odVariant(od), AB: '', AI: '', AP: '', AV: av, date: new Date(now - ageDays * DAY).toISOString() };
      if (rand() < 0.3) row.AB = odVariant(ods[Math.floor(rand() * ods.length)]);
      if (rand() < 0.1) row.AI = odVariant(ods[Math.floor(rand() * ods.length)]);

// First load: ODs 1 to 5 already synced, Marcus not yet (so Run sync has something to show).
function initialSync(db) {

// Puts the demo in a lively state: different ODs at different stages.
function applyDemoState(db) {
  const byId = (id) => db.ods.find((o) => o.id === id);
  const leadsOf = (id) => db.leads.filter((l) => l.odId === id && l.fit).sort((a, b) => a.rank - b.rank);
  const decide = (i) => (i % 10 === 3 ? 'no' : i % 10 === 7 ? 'friend' : 'yes');

  leadsOf('od1').forEach((l, i) => (l.decision = decide(i)));
  byId('od1').confirmedAt = new Date(Date.now() - DAY).toISOString();
  const sara = byId('od1').signed;
  if (sara.length) sara.slice().sort((a, b) => new Date(b.at) - new Date(a.at))[0].seen = false;

  leadsOf('od2').slice(0, 52).forEach((l, i) => (l.decision = decide(i)));
  leadsOf('od4').slice(0, 14).forEach((l) => (l.decision = 'yes'));
  leadsOf('od5').forEach((l, i) => (l.decision = decide(i + 2)));
  byId('od5').confirmedAt = new Date(Date.now() - 3 * DAY).toISOString();
  db.log.unshift({ at: new Date().toISOString(), text: 'Demo data loaded' });
}

module.exports = { build, initialSync, applyDemoState };

  var seed = require('./seed');
  var KEY = 'od-approvals-demo-v2', db = null;
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }

// route(method, pathname, searchParams, body, ctx) -> { status, json | text, contentType, login, logout }

const csvCell = (v) => '"' + String(v).replace(/"/g, '""') + '"';

    var rows = D.pairs.filter(function (p) {
      if (!inPeriod(p.date)) return false;
      var hay = (p.name + ' ' + p.handle + ' ' + p.odName + ' ' + p.odHandle).toLowerCase();
      if (g && hay.indexOf(g) < 0) return false;
      if (f.creator && (p.name + ' ' + p.handle).toLowerCase().indexOf(f.creator.toLowerCase()) < 0) return false;
      if (f.od && p.odId !== f.od) return false;
      if (f.signed && p.status !== f.signed) return false;
      return true;
    }).sort(function (a, b) { return new Date(b.date) - new Date(a.date); });
    var label = PERIODS.filter(function (x) { return x[0] === S.period; })[0];
    document.getElementById('t2sub').textContent = rows.length + ' creator and OD pairs · ' + label[1] + (label[2] ? ' (last ' + label[2] + ' days)' : '') + ' · last tracker sync ' + time(D.lastTrackerSyncAt);
    var pill = { yes: '<span class="pill ok">Yes</span>', progress: '<span class="pill warn">In progress</span>', no: '<span class="pill muted">No</span>' };
    document.querySelector('#t2 tbody').innerHTML = rows.length ? rows.slice(0, S.shown).map(function (p) {
      return '<tr><td><button class="btn small" data-act="synctracker" data-key="' + esc(p.key) + '">Run sync now</button></td>' +
        '<td><div style="font-weight:500">' + esc(p.name) + '</div><a class="small" href="' + ig(p.handle) + '" target="_blank" rel="noopener">' + esc(p.handle) + '</a></td>' +
        '<td><div>' + esc(p.odName) + '</div><div class="small muted">' + esc(p.odHandle) + '</div></td>' +
        '<td>' + pill[p.status] + '<div class="small muted" style="margin-top:2px">' + dshort(p.date) + '</div></td></tr>';
    }).join('') : '<tr><td colspan="4" class="muted">Nothing in this period.</td></tr>';
    document.getElementById('more').innerHTML = rows.length > S.shown ? '<button class="btn" style="margin-top:12px" data-act="more">Show more (' + (rows.length - S.shown) + ' left)</button>' : '';
  }

  app.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'gsearch') S.search = t.value;
    else if (t.dataset.f1 !== undefined) S.f1[t.dataset.f1] = t.value;
    else if (t.dataset.f2 !== undefined) S.f2[t.dataset.f2] = t.value;
    else return;
    S.shown = 15; renderT1(); renderT2();
  });

  app.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var a = b.dataset.act;
    if (a === 'logout') api('logout', {}).then(function () { D = null; loginView(); });
    else if (a === 'period') { S.period = b.dataset.v; S.shown = 15; [].forEach.call(document.querySelectorAll('[data-act=period]'), function (x) { x.classList.toggle('on', x === b); }); renderTiles(); renderT2(); }
    else if (a === 'more') { S.shown += 15; renderT2(); }
    else if (a === 'open') window.openOd(b.dataset.token);
    else if (a === 'syncod') { b.disabled = true; b.textContent = 'Syncing'; api('sync-leads', { odId: b.dataset.id }).then(refresh); }
    else if (a === 'synctracker') { b.disabled = true; b.textContent = 'Checking'; api('sync-tracker', {}).then(refresh); }
    else if (a === 'simulate') {
      var sel = document.getElementById('simod');
      api('simulate-sign', { odId: sel.value }).then(function (r) { document.getElementById('simmsg').textContent = 'Signed ' + r.handle + '. Open that OD to see the confetti.'; return refresh(); })
        .catch(function (er) { document.getElementById('simmsg').textContent = er.error || 'Failed'; });
    }
    else if (a === 'reset') { api('reset', {}).then(function () { D = null; S.shown = 15; return refresh(); }); }
    else if (a === 'export') {
      fetch('/api/ops/export.csv').then(function (r) { return r.text(); }).then(function (txt) {
        var url = '';
        
        var n = Math.max(0, txt.split('\n').length - 1);
        document.getElementById('exportbox').innerHTML = '<div class="card stack"><div class="spread"><h2>Cleared list (' + num(n) + ' creators)</h2><div class="row"><button class="btn small" data-act="copycsv">Copy CSV</button>' +
          (url ? '<a class="btn small" style="display:inline-flex;align-items:center;text-decoration:none" href="' + url + '" download="cleared-to-contact.csv">Download</a>' : '') +
          '<button class="btn small" data-act="closeexport">Close</button></div></div><textarea id="csvtxt" readonly rows="6" style="width:100%;font:12px monospace;border:1px solid var(--line);border-radius:8px;padding:8px"></textarea></div>';
        document.getElementById('csvtxt').value = txt;
      });
    }
    else if (a === 'copycsv') { var ta = document.getElementById('csvtxt'); ta.select(); try { document.execCommand('copy'); b.textContent = 'Copied'; } catch (x) {} }
    else if (a === 'closeexport') document.getElementById('exportbox').innerHTML = '';
  });

  refresh();
};

(function(){
  var user=null;try{user=sessionStorage.getItem('ops-user');}catch(e){}
  var route=require('./api').route;
  window.fetch=function(url,opt){
    opt=opt||{};var u=new URL(url,'http://x');var body={};
    try{if(opt.body)body=JSON.parse(opt.body);}catch(e){}
    var r=route((opt.method||'GET').toUpperCase(),u.pathname,u.searchParams,body,{user:user});
    if(r.login){user=r.login;try{sessionStorage.setItem('ops-user',user);}catch(e){}}
    if(r.logout){user=null;try{sessionStorage.removeItem('ops-user');}catch(e){}}
    var txt=r.text!==undefined?r.text:JSON.stringify(r.json);
    return Promise.resolve(new Response(txt,{status:r.status,headers:{'Content-Type':r.contentType||'application/json'}}));
  };
  window.openOd=function(t){window.showView('od',t);};
  var bar=document.getElementById('demobar'),pick=document.getElementById('odpick');
  var ods=require('./db').get().ods;
  pick.innerHTML=ods.map(function(o){return '<option value="'+o.token+'">'+o.name+'</option>'}).join('');
  window.showView=function(view,token){
    var old=document.getElementById('app'),fresh=old.cloneNode(false);
    old.replaceWith(fresh);
    fresh.className=view==='od'?'wrap':'';
    if(window.__opsTimer){clearInterval(window.__opsTimer);window.__opsTimer=null;}
    if(token)pick.value=token;
    bar.querySelectorAll('button.seg').forEach(function(b){b.classList.toggle('on',b.dataset.v===view);});
    if(view==='ops')window.startOps();else window.startOd(token||pick.value);
    window.scrollTo(0,0);
  };
  bar.addEventListener('click',function(e){var b=e.target.closest('button.seg');if(b)window.showView(b.dataset.v,b.dataset.v==='od'?pick.value:null);});
  pick.addEventListener('change',function(){window.showView('od',pick.value);});
  window.showView('ops');
})();
</script></body></html>
